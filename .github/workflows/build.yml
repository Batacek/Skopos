name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The markdown grammars are not in the TreeSitter.DotNet package, they are built
      # from source. Without this step the markdown highlighting tests would not pass.
      - name: Gramatiky (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./grammars/build-grammars.ps1

      - name: Gramatiky (Unix)
        if: runner.os != 'Windows'
        run: ./grammars/build-grammars.sh

      - name: Build
        run: dotnet build -c Release

      - name: Testy
        run: dotnet test -c Release --no-build --verbosity normal

  # Startup time only stays low if it keeps being measured. This job produces an AOT build,
  # times startup and watches the package size.
  aot:
    name: NativeAOT (win-x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Gramatiky
        shell: pwsh
        run: ./grammars/build-grammars.ps1

      - name: Package
        shell: pwsh
        run: ./packaging/build-release.ps1 -SkipGrammars

      # Measures from the first line of Main() to the first paint. The first few runs are
      # discarded — the first run of a freshly linked binary misses the file cache and would
      # measure the disk, not the application.
      - name: Measure startup
        shell: pwsh
        run: |
          $exe = "artifacts/stage/win-x64/skopos.exe"
          $sample = "$env:TEMP/mereni.json"
          '{ "a": 1, "b": [1, 2, 3], "c": { "d": true } }' | Set-Content $sample

          $times = @()
          for ($i = 0; $i -lt 6; $i++) {
            $log = "$env:TEMP/timing-$i.txt"
            $p = Start-Process $exe -ArgumentList '--timing','--new-instance',"`"$sample`"" `
                 -PassThru -RedirectStandardError $log -RedirectStandardOutput "$env:TEMP/out-$i.txt"
            Start-Sleep -Seconds 3
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

            $line = Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -like '*vykreslen*' }
            if ($line -match 'celkem\s+([\d,\.]+)') {
              if ($i -ge 2) { $times += [double](($matches[1]) -replace ',', '.') }
            }
          }

          if ($times.Count -eq 0) { throw 'Startup could not be measured.' }

          $avg = ($times | Measure-Object -Average).Average
          Write-Host ("Start (Main -> prvni vykresleni): {0:N1} ms" -f $avg)
          Write-Host ("::notice title=Start::{0:N1} ms" -f $avg)

          # The target is ~155 ms; a GitHub runner is slower and noisier than a developer
          # machine, so the threshold is looser here. The point is catching a regression,
          # not pinning an exact number.
          if ($avg -gt 400) { throw ("Start {0:N1} ms je mimo rozpoctem danou hranici." -f $avg) }

      - uses: actions/upload-artifact@v4
        with:
          name: skopos-win-x64
          path: artifacts/*.zip
          if-no-files-found: error
